[project]
name = "scraper"
version = "0.1.0"
description = "Scrapes the webscraper.io static e-commerce test site into a single JSON document."
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.27", "selectolax>=0.3.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "playwright>=1.45"]

[project.scripts]
scraper = "scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not contract'"
markers = ["contract: hits the live site with a real browser (run with `pytest -m contract`)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
